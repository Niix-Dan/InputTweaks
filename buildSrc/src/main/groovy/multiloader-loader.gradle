plugins {
    id 'multiloader-common'
    id 'me.modmuss50.mod-publish-plugin'
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('processResources') {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Javadoc).configureEach {
    options.addStringOption('Xdoclint:none', '-quiet')
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

def parseChangelog(File file, String targetVersion) {
    if (!file.exists()) return ""

    def text = file.text.replace("\r\n", "\n")
    def sections = text.split(/(?m)^---\s*$/)

    for (String section : sections) {
        def trimmed = section.trim()
        if (trimmed.startsWith("## v${targetVersion}") || trimmed.startsWith("## ${targetVersion}")) {
            return trimmed.replaceFirst(/(?m)^##\s*v?[^\n]+\n?/, "").trim()
        }
    }

    if (sections.length > 0) {
        return sections[0].replaceFirst(/(?m)^##\s*v?[^\n]+\n?/, "").trim()
    }

    return ""
}

publishMods {
    def changelogFile = rootProject.file("CHANGELOG.md")
    changelog = parseChangelog(changelogFile, project.version.toString())

    type = STABLE
    version = "${project.version}"

    def loaderDisplayNames = [
            'fabric': 'Fabric',
            'forge' : 'Forge/NeoForge'
    ]
    def loaderName = loaderDisplayNames.get(project.name, project.name.capitalize())
    displayName = "${mod_name} ${loaderName} v${project.version}"

    if (project.name == 'fabric') {
        modLoaders.addAll('fabric')
    } else if (project.name == 'forge') {
        modLoaders.addAll('forge', 'neoforge')
    }

    curseforge {
        accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
        projectId = rootProject.properties['curseforge_id']
        clientRequired = true
        serverRequired = false

        minecraftVersions.add("1.20.1")
    }
}

afterEvaluate {
    publishMods {
        if (tasks.names.contains('remapJar')) {
            file = tasks.named('remapJar').flatMap { it.archiveFile }
        } else if (tasks.names.contains('reobfJar')) {
            file = tasks.named('reobfJar').flatMap { it.output }
        } else {
            file = tasks.named('jar').flatMap { it.archiveFile }
        }
    }
}